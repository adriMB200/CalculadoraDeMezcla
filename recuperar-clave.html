<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><meta http-equiv="Cache-Control" content="no-store">
<title>Recuperar contraseña | Enduro Nalón</title><link rel="icon" href="imagen/img.jpg"><link rel="stylesheet" href="css/cuentas-seguras.css"><script src="js/recuperar-clave.js" defer></script></head>
<body><header class="account-head"><a href="index.html">← ENDURO NALÓN</a></header><main class="account-layout narrow"><p class="eyebrow">RECUPERAR ACCESO</p><h1>Recupera tu contraseña</h1>
<p id="mensaje" role="status" aria-live="polite"></p>
<section class="panel" id="solicitud"><h2>Recibir un enlace seguro</h2><p>Introduce tu usuario o el correo verificado. Si existe una cuenta asociada, recibirás un enlace válido 20 minutos.</p>
<form id="formSolicitud"><label>Usuario o email<input type="text" name="identificador" maxlength="254" autocomplete="username" required></label>
<button type="submit">Solicitar enlace</button></form></section>
<section class="panel" id="restablecer" hidden><h2>Establecer contraseña nueva</h2>
<form id="formNueva"><label>Nueva contraseña<input name="password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required></label>
<label>Repetir contraseña<input name="confirmar" type="password" minlength="12" autocomplete="new-password" required></label>
<button type="submit">Guardar contraseña</button></form></section>
<p><a href="index.html">Volver a Enduro Nalón</a></p></main></body></html>
